<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BUYER CLUB</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg: #0a0b0e;
      --surface: rgba(24, 27, 34, 0.85);
      --surface-light: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --gold: #f59e0b;
      --emerald: #10b981;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 18px 16px 96px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #161e31 0%, #0a0b0e 45%);
      color: var(--text); min-height: 100vh;
    }

    /* Элегантная карта профиля */
    .vip-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      position: relative; overflow: hidden;
    }
    .vip-card::after {
      content: ''; position: absolute; top: -40%; right: -20%;
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .vip-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .vip-name { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; margin: 0; }
    .vip-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .tier-badge {
      padding: 6px 13px; border-radius: 99px; font-size: 11px; font-weight: 800;
      letter-spacing: 0.8px; text-transform: uppercase;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
    }
    .tier-SILVER { background: linear-gradient(135deg, #64748b, #94a3b8); }
    .tier-GOLD { background: linear-gradient(135deg, #d97706, #fbbf24); color: #111; }
    .tier-VIP { background: linear-gradient(135deg, #7c3aed, #ec4899); }

    .vip-metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-top: 18px; padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .m-item { text-align: left; }
    .m-val { font-size: 17px; font-weight: 800; color: #fff; }
    .m-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Стеклянные карточки */
    .card {
      background: var(--surface); backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 18px; margin-bottom: 14px;
    }
    .sec-title {
      font-size: 16px; font-weight: 700; margin: 0 0 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pill-info {
      font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 8px;
      background: rgba(16, 185, 129, 0.14); color: #34d399;
    }

    /* Поля ввода */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 13px 14px; border-radius: 13px;
      border: 1px solid var(--border); background: rgba(10, 11, 14, 0.75);
      color: var(--text); font-size: 15px; outline: none; transition: border 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Калькулятор итога */
    .receipt {
      background: var(--surface-light); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-top: 14px;
    }
    .r-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .r-row b { color: var(--text); }
    .r-total {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.12);
      font-size: 15px; font-weight: 700;
    }
    .r-total span:last-child { font-size: 20px; font-weight: 800; color: #60a5fa; }

    /* Кнопки */
    .btn-primary {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 6px 20px var(--primary-glow); margin-top: 14px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
    .btn-ghost {
      width: 100%; padding: 13px; border-radius: 14px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px;
    }

    /* Прогресс бар */
    .bar-bg { background: rgba(255,255,255,0.08); height: 8px; border-radius: 99px; overflow: hidden; margin: 12px 0 8px; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #10b981); border-radius: 99px; transition: width 0.4s; }
    .bar-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

    /* Карточки уровней */
    .lvl-card {
      border: 1px solid var(--border); border-radius: 16px; padding: 14px;
      margin-bottom: 10px; background: rgba(255,255,255,0.02);
    }
    .lvl-card.current { border-color: var(--primary); background: rgba(59, 130, 246, 0.08); }
    .lvl-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .lvl-title { font-weight: 700; font-size: 15px; }
    .lvl-req { font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.06); padding: 3px 8px; border-radius: 6px; }
    .lvl-list { margin: 0; padding-left: 16px; font-size: 13px; color: #d1d5db; line-height: 1.65; }

    /* Табы */
    .tab { display: none; animation: fadeIn 0.25s ease; }
    .tab.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Нижняя панель */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15, 17, 23, 0.92); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 99;
    }
    .nav-btn { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; cursor: pointer; }
    .nav-btn.active { color: #60a5fa; }
    .nav-btn span { display: block; font-size: 20px; margin-bottom: 3px; }
  </style>
</head>
<body>

  <!-- Клубная карта клиента -->
  <div class="vip-card">
    <div class="vip-top">
      <div>
        <h1 class="vip-name" id="uName">Добро пожаловать</h1>
        <div class="vip-sub" id="uProgressSub">Выкуплено: 0 кг • До Silver: 10 кг</div>
      </div>
      <div class="tier-badge" id="uBadge">BRONZE</div>
    </div>
    <div class="vip-metrics">
      <div class="m-item">
        <div class="m-val" id="mKm">0 км</div>
        <div class="m-lbl">Баланс пути</div>
      </div>
      <div class="m-item">
        <div class="m-val" id="mRef">0 ₽</div>
        <div class="m-lbl">Реф. скидка</div>
      </div>
      <div class="m-item">
        <div class="m-val" id="mKg">0 кг</div>
        <div class="m-lbl">Бесплатных кг</div>
      </div>
    </div>
  </div>

  <!-- ВКЛАДКА 1: ЗАЯВКА И КАЛЬКУЛЯТОР -->
  <div id="tab-order" class="tab active">
    <div class="card">
      <div class="sec-title">
        <span>Запрос на выкуп вещи</span>
        <span class="pill-info" id="respSpeed">Стандартный отклик</span>
      </div>

      <div class="field">
        <label>Название или описание товара *</label>
        <input type="text" id="item" placeholder="Например: Nike Air Force 1 Low White" />
      </div>

      <div class="field">
        <label>Ссылка на товар (Poizon / Taobao / 1688)</label>
        <input type="text" id="link" placeholder="Вставьте ссылку..." />
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Размер / Цвет</label>
          <input type="text" id="size" placeholder="42 EU / Белый" />
        </div>
        <div class="field">
          <label>Цена в юанях (¥)</label>
          <input type="number" id="cny" placeholder="500" oninput="recalc()" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Примерный вес (кг)</label>
          <input type="number" id="weight" value="1" step="0.1" oninput="recalc()" />
        </div>
        <div class="field">
          <label>Использовать реф. скидку</label>
          <select id="useRef" onchange="recalc()">
            <option value="yes">Списать доступную</option>
            <option value="no">Не списывать</option>
          </select>
        </div>
      </div>

      <div class="receipt" id="receiptBox"></div>

      <button class="btn-primary" onclick="sendRequest()">Отправить заявку менеджеру</button>
    </div>
  </div>

  <!-- ВКЛАДКА 2: КИЛОМЕТРЫ И РЕФЕРАЛЫ -->
  <div id="tab-miles" class="tab">
    <div class="card">
      <div class="sec-title">
        <span>Накопление километров</span>
        <span class="pill-info">100 ₽ = 1 км</span>
      </div>
      <p style="font-size:13px; color:var(--muted); margin:0; line-height:1.5;">
        С каждой покупки начисляются километры. Накопите <b>1 000 км</b> и обменяйте их на <b>1 кг бесплатной доставки</b>.
      </p>

      <div class="bar-bg"><div class="bar-fill" id="kmFill" style="width: 0%;"></div></div>
