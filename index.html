<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BUYER ATELIER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090a0d;
      --card: rgba(20, 22, 29, 0.9);
      --glass: rgba(255, 255, 255, 0.035);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #e2e8f0;
      --gold: #d4af37;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px 16px 110px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background:
        radial-gradient(circle at 85% 5%, rgba(212, 175, 55, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 10% 35%, rgba(59, 130, 246, 0.1) 0%, transparent 45%),
        var(--bg);
      color: var(--text); min-height: 100vh;
    }

    .brand-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; padding: 0 2px;
    }
    .brand-logo {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      color: var(--accent);
    }
    .brand-tag {
      font-size: 11px; color: var(--muted); letter-spacing: 0.4px;
    }

    .member-card {
      background: linear-gradient(145deg, #161922 0%, #0d0f14 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      position: relative; overflow: hidden;
    }
    .member-card::before {
      content: ''; position: absolute; top: -50%; left: -20%;
      width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }
    .mc-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .mc-user { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; margin: 0; }
    .mc-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .status-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 99px; font-size: 11px; font-weight: 800;
      letter-spacing: 0.9px; text-transform: uppercase; cursor: pointer;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; transition: transform 0.15s;
    }
    .status-btn:active { transform: scale(0.95); }
    .st-SILVER { background: linear-gradient(135deg, #475569, #94a3b8); border-color: #cbd5e1; }
    .st-GOLD { background: linear-gradient(135deg, #b45309, #f59e0b); color: #090a0d; border-color: #fde68a; }
    .st-VIP { background: linear-gradient(135deg, #6d28d9, #db2777); border-color: #f472b6; }

    .mc-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .mc-val { font-size: 15px; font-weight: 800; color: #fff; }
    .mc-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.3px; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 22px; padding: 18px; margin-bottom: 14px;
    }
    .sec-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .sec-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 16px; font-weight: 700; margin: 0;
    }
    .badge-soft {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px;
      background: rgba(212, 175, 55, 0.14); color: #facc15; border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 13px 14px; border-radius: 14px;
      border: 1px solid var(--border); background: rgba(9, 10, 13, 0.85);
      color: var(--text); font-size: 15px; outline: none;
    }
    input:focus, select:focus { border-color: var(--gold); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .receipt {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-top: 14px;
    }
    .r-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .r-line b { color: var(--text); }
    .r-sum {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.14);
      font-size: 14px; font-weight: 700;
    }
    .r-sum span:last-child { font-size: 20px; font-weight: 800; color: #facc15; }

    .btn-main {
      width: 100%; padding: 15px; border: none; border-radius: 15px;
      background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
      color: #090a0d; font-size: 15px; font-weight: 800; cursor: pointer;
      margin-top: 14px; letter-spacing: 0.2px; position: relative; z-index: 10;
    }
    .btn-main:active { opacity: 0.85; transform: scale(0.99); }
    .btn-dark {
      width: 100%; padding: 14px; border-radius: 15px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px;
    }

    .route-bar {
      background: rgba(255,255,255,0.08); height: 8px; border-radius: 99px;
      overflow: hidden; margin: 12px 0 8px;
    }
    .route-fill {
      height: 100%; background: linear-gradient(90deg, #d4af37, #10b981); border-radius: 99px;
    }
    .route-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

    .friend-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 12px; border-radius: 13px; background: var(--glass);
      border: 1px solid var(--border); margin-bottom: 8px; font-size: 13px;
    }
    .friend-name { font-weight: 700; color: #fff; }
    .friend-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .friend-bonus { font-weight: 800; color: var(--emerald); text-align: right; }

    .tier-box {
      border: 1px solid var(--border); border-radius: 18px; padding: 15px;
      margin-bottom: 10px; background: var(--glass);
    }
    .tier-box.active {
      border-color: var(--gold); background: rgba(212, 175, 55, 0.08);
    }
    .tb-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tb-name { font-size: 15px; font-weight: 800; }
    .tb-req { font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.07); padding: 3px 9px; border-radius: 8px; }
    .tb-list { margin: 0; padding-left: 16px; font-size: 13px; color: #cbd5e1; line-height: 1.65; }

    .tab { display: none; }
    .tab.active { display: block; }

    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11, 13, 18, 0.95); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 99;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; color: var(--muted); font-weight: 600; cursor: pointer;
    }
    .nav-item.active { color: #facc15; }
  </style>
</head>
<body>

  <div class="brand-bar">
    <div class="brand-logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      BUYER ATELIER
    </div>
    <div class="brand-tag">Concierge & Logistics</div>
  </div>

  <div class="member-card">
    <div class="mc-top">
      <div>
        <h1 class="mc-user" id="uName">Клиент клуба</h1>
        <div class="mc-sub" id="uSub">Выкуплено: 0 кг • До Silver: 10 кг</div>
      </div>
      <button type="button" class="status-btn" id="statusBtn" onclick="openStatusTab()">
        <span id="statusLabel">BRONZE</span> ▾
      </button>
    </div>
    <div class="mc-grid">
      <div><div class="mc-val" id="mKm">0 км</div><div class="mc-lbl">Путь</div></div>
      <div><div class="mc-val" id="mKg">0 кг</div><div class="mc-lbl">За км</div></div>
      <div><div class="mc-val" id="mRefRub">0 ₽</div><div class="mc-lbl">Скидка</div></div>
      <div><div class="mc-val" id="mRefsCnt">0</div><div class="mc-lbl">Друзей</div></div>
    </div>
  </div>

  <div id="tab-order" class="tab active">
    <div class="card">
      <div class="sec-head">
        <h2 class="sec-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Запрос на выкуп
        </h2>
        <span class="badge-soft" id="speedBadge">Стандарт</span>
      </div>

      <div class="field">
        <label>Название модели или описание *</label>
        <input type="text" id="item" placeholder="Например: Maison Margiela Replica" />
      </div>

      <div class="field">
        <label>Ссылка на товар (Poizon / Taobao / 1688)</label>
        <input type="url" id="link" placeholder="https://..." />
      </div>

      <div class="grid-2">
        <div class="field"><label>Размер / Цвет</label><input type="text" id="size" placeholder="42 EU / Black" /></div>
